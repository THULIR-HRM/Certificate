[variables]
NIXPACKS_PYTHON_VERSION = "3.13"

[phases.setup]
nixPkgs = ["mupdf"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python manage.py collectstatic --noinput"
]

[start]
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
